<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>저축은행 업계 뉴스</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>저축은행 업계 뉴스</h1>
      <p class="subtitle">중복·구식·광고성 기사를 거른 업계 뉴스 모음</p>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div class="chips" id="keywordChips"></div>
      <div class="status">
        <span id="updatedAt">불러오는 중...</span>
        <button id="refreshBtn" class="refresh-btn" title="새로고침">새로고침</button>
      </div>
    </div>

    <div id="newsList" class="news-grid"></div>
    <p id="emptyState" class="empty-state" hidden>표시할 기사가 없습니다.</p>
  </main>

  <footer class="footer">
    <p>네이버 뉴스 검색 기반 · 30분마다 자동 수집 · 72시간 이내 기사만 표시</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
