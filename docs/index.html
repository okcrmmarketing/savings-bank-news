<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데일리 저축은행 신문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Song+Myung&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="inkDistort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.07" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <header class="topbar">
    <div class="exclusive-strip">
      <span class="exclusive-badge">☞ EXCLUSIVE</span>
      <span class="exclusive-filler" id="exclusiveFiller"></span>
    </div>
    <div class="topbar-inner">
      <p class="motto">~ The Daily Savings Prophet ~</p>
      <h1>데일리 저축은행 신문</h1>
      <div class="masthead-rule"></div>
      <p class="subtitle">중복·구식·광고성 기사를 거른 업계 뉴스 모음 · 30분마다 자동으로 갱신됩니다</p>
      <div class="dateline">
        <span id="datelineDate"></span>
        <span id="datelineCount"></span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div class="chips" id="keywordChips"></div>
      <div class="status">
        <span id="updatedAt">불러오는 중...</span>
        <button id="refreshBtn" class="refresh-btn" title="새로고침">새로고침</button>
      </div>
    </div>

    <div class="news-grid-wrap">
      <div id="newsList" class="news-grid"></div>
    </div>
    <p id="emptyState" class="empty-state" hidden>부엉이가 아직 기사를 물어오지 않았습니다.</p>

    <div id="pager" class="pager" hidden>
      <button id="prevPageBtn" class="page-btn">◀ 이전 페이지</button>
      <span id="pageIndicator" class="page-indicator">1 / 1</span>
      <button id="nextPageBtn" class="page-btn">다음 페이지 ▶</button>
    </div>
  </main>

  <footer class="footer">
    <div class="section-index" id="sectionIndex"></div>
    <p>네이버 뉴스 검색 기반 · 30분마다 부엉이가 자동으로 물어옴 · 72시간 이내 기사만 표시</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
